[project]
name = "projet8"
version = "0.1.0"
description = "Mise en production et monitoring du modèle de scoring crédit (OpenClassrooms, projet 8)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "lightgbm==4.6.0",
    "numpy==2.5.0",
    "pandas==2.3.3",
    "pyyaml>=6.0.3",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "evidently>=0.7.23",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
