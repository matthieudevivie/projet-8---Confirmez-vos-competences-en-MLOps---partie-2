name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/matthieudevivie/scoring-credit
  URL_PRODUCTION: https://scoring-credit.onrender.com

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Installer Python et les dépendances
        run: uv sync --locked
      - name: Lancer les tests
        run: uv run pytest -v

  image:
    name: image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Construire l'image Docker
        run: docker build --build-arg COMMIT="$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" .
      - name: Démarrer le conteneur et vérifier qu'il répond
        run: |
          docker run --detach --name api --publish 7860:7860 "$IMAGE:$GITHUB_SHA"
          for _ in $(seq 1 30); do
            curl --silent --fail localhost:7860/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
      - name: Publier l'image sur le registre de GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    name: deploy
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.URL_PRODUCTION }}
    steps:
      - name: Demander à Render de déployer l'image de ce commit
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --get --data-urlencode "imgURL=$IMAGE:$GITHUB_SHA" "$RENDER_DEPLOY_HOOK"
      - name: Attendre que la nouvelle version réponde en production
        run: |
          for _ in $(seq 1 60); do
            commit=$(curl --silent --fail "$URL_PRODUCTION/health" | jq --raw-output .commit || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Version $GITHUB_SHA en ligne sur $URL_PRODUCTION"
              exit 0
            fi
            echo "En production : ${commit:-aucune réponse}, en attente de $GITHUB_SHA"
            sleep 10
          done
          echo "La nouvelle version n'a pas répondu en 10 minutes"
          exit 1
