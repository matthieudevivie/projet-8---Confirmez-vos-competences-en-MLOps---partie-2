name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Installer Python et les dépendances
        run: uv sync --locked

      - name: Lancer les tests
        run: uv run pytest -v
